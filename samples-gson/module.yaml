product: jvm/app

apply:
  - ../ktor.module-template.yaml

description: Runnable Gson sample for Ktor Server Route Binding.

repositories:
  - https://central.sonatype.com/repository/maven-snapshots/

dependencies:
  - io.github.harryjhin:ktor-server-route-binding:0.0.1-SNAPSHOT
  - io.github.harryjhin:ktor-server-route-binding-serialization-gson:0.0.1-SNAPSHOT
  - io.ktor:ktor-server-content-negotiation
  - io.ktor:ktor-server-netty
  - io.ktor:ktor-serialization-gson

settings:
  ktor: enabled
  jvm:
    mainClass: io.github.harryjhin.routebinding.samples.gson.ApplicationKt
