product: jvm/app

apply:
  - ../../ktor.module-template.yaml

description: Runnable basic sample for Ktor Server Route Binding.

repositories:
  - https://central.sonatype.com/repository/maven-snapshots/

dependencies:
  - io.github.harryjhin:ktor-server-route-binding:0.0.1-SNAPSHOT
  - io.ktor:ktor-server-content-negotiation
  - io.ktor:ktor-server-netty
  - io.ktor:ktor-serialization-kotlinx-json

settings:
  ktor: enabled
  kotlin:
    serialization: json
  jvm:
    mainClass: io.github.harryjhin.routebinding.samples.basic.ApplicationKt
