product: jvm/app

apply:
  - ../../ktor.module-template.yaml

description: Runnable Jackson sample for Ktor Server Route Binding.

repositories:
  - https://repo.maven.apache.org/maven2

dependencies:
  - io.github.harryjhin:ktor-server-route-binding:0.0.1
  - io.github.harryjhin:ktor-server-route-binding-serialization-jackson:0.0.1
  - io.ktor:ktor-server-content-negotiation
  - io.ktor:ktor-server-netty
  - io.ktor:ktor-serialization-jackson

settings:
  ktor: enabled
  jvm:
    mainClass: io.github.harryjhin.routebinding.samples.jackson.ApplicationKt
