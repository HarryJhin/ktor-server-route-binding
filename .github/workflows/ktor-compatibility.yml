name: Ktor Compatibility

on:
  pull_request:
    paths:
      - 'core/**'
      - 'serialization-gson/**'
      - 'serialization-jackson/**'
      - 'serialization-kotlinx-json/**'
      - 'samples/**'
      - 'ktor.module-template.yaml'
      - 'project.yaml'
      - 'scripts/test-ktor-compatibility.sh'
      - '.github/workflows/ktor-compatibility.yml'
      - '.github/workflows/publish.yml'
      - 'kotlin'
      - 'kotlin.bat'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'serialization-gson/**'
      - 'serialization-jackson/**'
      - 'serialization-kotlinx-json/**'
      - 'samples/**'
      - 'ktor.module-template.yaml'
      - 'project.yaml'
      - 'scripts/test-ktor-compatibility.sh'
      - '.github/workflows/ktor-compatibility.yml'
      - '.github/workflows/publish.yml'
      - 'kotlin'
      - 'kotlin.bat'
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ktor ${{ matrix.ktor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ktor:
          - 3.0.3
          - 3.1.3
          - 3.2.3
          - 3.3.3
          - 3.4.3
          - 3.5.2

    steps:
      - uses: actions/checkout@v6

      - name: Test compatibility
        run: ./scripts/test-ktor-compatibility.sh "${{ matrix.ktor }}"
