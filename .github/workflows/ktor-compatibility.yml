name: Ktor Compatibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Ktor ${{ matrix.ktor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ktor:
          - 3.0.3
          - 3.1.3
          - 3.2.3
          - 3.3.3
          - 3.4.3
          - 3.5.2

    steps:
      - uses: actions/checkout@v6

      - name: Test compatibility
        run: ./scripts/test-ktor-compatibility.sh "${{ matrix.ktor }}"
