name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  compatibility:
    name: Ktor ${{ matrix.ktor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ktor:
          - 3.0.3
          - 3.1.3
          - 3.2.3
          - 3.3.3
          - 3.4.3
          - 3.5.2

    steps:
      - uses: actions/checkout@v6

      - name: Test compatibility
        run: ./scripts/test-ktor-compatibility.sh "${{ matrix.ktor }}"

  publish:
    needs: compatibility
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify release version
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          configured_version="$(sed -n 's/^    version: //p' library.module-template.yaml)"
          test "$expected_version" = "$configured_version"

      - name: Test
        run: ./kotlin test

      - name: Upload to Maven Central
        run: ./kotlin publish mavenCentral
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
