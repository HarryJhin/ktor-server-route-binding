name: Publish SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      version:
        description: Development version ending in -SNAPSHOT
        required: true
        default: 0.0.2-SNAPSHOT
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Publish SNAPSHOT to Central Portal
        run: ./scripts/publish-snapshot.sh "${{ inputs.version }}"
        env:
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
